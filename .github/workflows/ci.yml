name: CI
# Na main quem compila é o build.yml (que também roda os testes); aqui só os pull requests.
on:
  pull_request:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Placeholders dos resources (baixados só no release)
        shell: bash
        run: mkdir -p resources/adb resources/vdd && touch resources/adb/x resources/vdd/x resources/tabdisplay.apk
      - run: cargo check --locked
      - run: cargo fmt --all -- --check
      - name: Verificar sintaxe do frontend
        run: node --check ../src/main.js
      # O runner macOS compila o crate, mas o binário de teste não encontra
      # libswift_Concurrency; isso é uma limitação nomeada, não um skip oculto.
      - run: cargo test --locked
        if: runner.os == 'Windows'

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
